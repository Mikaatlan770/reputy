# ============================================================
# P0.1 / P6 — Guard: empêche le commit de secrets dans le repo
# Exécuté sur chaque PR et chaque push sur main
# ============================================================
name: Guard Secrets

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  guard-secrets:
    name: 🔒 Check no secrets in git
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run guard:secrets
        run: npm run guard:secrets
